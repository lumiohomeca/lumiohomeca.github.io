<style>
:root{--ink:#10100f;--coal:#1b1a18;--paper:#eee9df;--muted:#b8b1a5;--gold:#c49a58;--line:#ffffff20}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.6 Arial}.shell{max-width:1200px;margin:auto;padding:0 5vw}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;padding:23px 0;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}button{font:inherit}.lang{background:transparent;border:1px solid var(--gold);color:var(--paper);padding:9px 12px;font-size:10px;letter-spacing:.12em;cursor:pointer}.hero{padding:80px 0 58px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#10100f 55%,#272117)}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.22em;text-transform:uppercase}.hero h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:.98}.hero h1{font-size:clamp(56px,9vw,112px);max-width:820px;margin:18px 0}.hero p{max-width:675px;font-size:18px;color:var(--muted)}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:44px 0 0}.roadmap a{padding:22px;background:var(--coal)}.roadmap b{display:block;color:var(--gold);font-size:10px;letter-spacing:.15em}.roadmap span{display:block;font:25px/1 Georgia,serif;margin-top:8px}.level{padding:70px 0 0}.level-head{max-width:710px}.level h2{font-size:46px;margin:10px 0}.level-head p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:30px}.course{display:flex;flex-direction:column;min-height:310px;padding:28px;background:var(--coal);transition:background .2s}.course:hover{background:#25231e}.course small{color:var(--gold);letter-spacing:.14em;font-weight:bold;font-size:10px}.course h3{font-size:29px;margin:15px 0}.course p{color:var(--muted);margin:0}.course .read{margin-top:auto;padding-top:24px;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.promise{padding:70px 0;border-top:1px solid var(--line);margin-top:70px;color:var(--muted)}.promise h2{font-size:42px;color:var(--paper)}@media(max-width:760px){.roadmap,.grid{grid-template-columns:1fr}.hero{padding-top:56px}.level{padding-top:55px}.course{min-height:250px}}
.course .read.action{align-self:flex-start;border:1px solid var(--gold);padding:10px 12px;color:var(--paper)}.course:hover .read.action{background:var(--gold);color:var(--ink)}
</style>
